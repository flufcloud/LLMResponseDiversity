    "modal>=1.5.4",
    "numpy>=2.5.1",
    "openai>=2.53.0",
    "pandas>=3.0.5",
    "polars>=1.35.2",
    "pronouncing>=0.2.0",
    "scikit-learn>=1.9.0",
    "sentencepiece>=0.2.1",
    "sentence-transformers>=5.1.0",
    "spacy==3.8.14",
    "stanza>=1.15.0",
    "tqdm>=4.67.1",
